description: 'Burlington Stores, Inc. (NYSE: BURL) is a US national off-price department store retailer
  offering brand-name clothing, footwear, accessories, baby products and home decor at everyday low prices
  across more than 1,200 stores. Burlington operates no public developer program: no OpenAPI, GraphQL,
  gRPC, SOAP or event contract is served on any host it controls. Its one documented machine-to-machine
  surface is ASC X12 version 4010 EDI for merchandise vendors and freight carriers, and unusually for
  a retailer of this size the implementation guides are fully public — seventeen transaction-set PDFs
  plus a GS1-128 shipping label companion report, readable without a login at burlington.com/vendors/edi.
  The runtime behind them, the Gateway Vendor Management Suite, is invite-only.'
apis:
- aid: burlington-stores:burlington-stores-website
  name: Burlington Stores
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/burlington-stores.png
  tags:
  - Retail
  - E-Commerce
  - Company
  humanURL: https://www.burlington.com
  description: 'Burlington''s consumer storefront: shopping, store locator, gift cards, loyalty and credit
    card servicing. No public API is published behind it. Every /.well-known/ path, /openapi.json and
    /llms.txt on this host answers HTTP 200 with the site''s Next.js shell titled ''404 Not Found | Burlington''
    — a soft-404, confirmed against a control path that cannot exist — so no discovery document is served.
    baseURL is deliberately null: repair-api-bases.py returns ''missing'' and no Burlington source names
    an API host, so recording the website root here would be a marketing base masquerading as an API host.'
  properties:
  - type: Website
    url: https://www.burlington.com
- aid: burlington-stores:burlington-stores-edi
  name: Burlington Stores EDI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/burlington-stores.png
  tags:
  - EDI
  - X12
  - Supply Chain
  - Retail
  - B2B
  humanURL: https://www.burlington.com/vendors/edi
  description: 'Burlington''s ASC X12 version 4010 EDI trading-partner interface — the company''s only
    documented machine-to-machine surface. Seventeen implementation guides are published as public PDFs
    with sample interchanges: 001 control segments, 810 invoice, 824 application advice, 850 purchase
    order, 852 product activity data, 856 ship notice/manifest, 860 PO change, 997 functional acknowledgment,
    832 price/sales catalog, 846 inventory availability, 858 shipment information, the 204/210/211/214/990
    motor carrier sets, and 855 non-merchandise POA, plus a GS1-128 serial shipping container label companion
    report. Every guide declares ''X12/V4010/<set>'' and ''Version: 4.0 Final'' on page one, authored
    by Burlington Stores, Inc. The specifications are readable without an account; the runtime is not
    — interchanges are transacted through the Gateway Vendor Management Suite at edi.coat.com, an invite-only
    login, with onboarding through vendor.setup@burlington.com. There is no HTTP API, so baseURL is null
    by fact rather than by gap.'
  properties:
  - type: Documentation
    url: https://www.burlington.com/vendors/edi
