notes: |
  Re-checked 2026-09-05 by searching Burlington's own site rather than restating the 2026-05-04 bulk
  sweep. plan_count is 0 and the zero is now evidenced: there is no developer portal, no pricing page
  for any programmatic surface, and no sign-up. The only machine-to-machine surface Burlington
  documents is ASC X12 4010 EDI for merchandise vendors and freight carriers
  (https://www.burlington.com/vendors/edi, HTTP 200). Access to it is granted by Vendor Relations
  under a bilateral trading-partner agreement — the published "10/15 EDI Agreement" PDF — and carries
  no published tiers, quotas, overage or list price. Gateway, Burlington's free web-based EDI
  solution at https://edi.coat.com, is described as free to vendors but is an invite-only login, so
  there is no priced plan to record for it either.
  The prior note that corporate.burlington.com was consulted was wrong: that host does not resolve
  (DNS NXDOMAIN, checked 2026-09-05). Investor material is at https://www.burlingtoninvestors.com/.
