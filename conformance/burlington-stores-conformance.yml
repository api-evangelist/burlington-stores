provider: Burlington Stores
providerId: burlington-stores
specification: API Commons Conformance
specificationVersion: '0.1'
description: >-
  Burlington Stores publishes no REST, GraphQL, gRPC, SOAP or event contract, so none of
  the usual web-API conformance families (oauth2, oidc, json:api, rfc9457, pagination,
  idempotency) apply. What it does publish, in the open and without a login, is a complete
  ASC X12 version 4010 EDI implementation library for its trading partners: seventeen
  transaction-set implementation guides plus a GS1-128 serial shipping container label
  companion report, each as a downloadable PDF with an accompanying sample interchange.
  The domain-standard declaration is inside the contracts themselves — every guide's first
  page carries the string "X12/V4010/<set>" and "Version: 4.0 Final", authored by
  Burlington Stores, Inc. — which is the evidence recorded below.
tags:
  - EDI
  - X12
  - Retail
  - Supply Chain
  - GS1
notes: |
  The specification library is public; the RUNTIME is not. Interchange is transacted
  through Burlington's "Gateway" Vendor Management Suite at https://edi.coat.com, which is
  an invite-only login, and vendor onboarding runs through vendor.setup@burlington.com. So
  a partner can read the full contract before signing, but cannot exercise it anonymously.

  No security certification, attestation or trust centre (SOC 2, ISO 27001, PCI DSS,
  HIPAA, FedRAMP) is published on any Burlington host, so no `Compliance` pointer is wired
  into apis.yml. Absence here is a measurement, not an omission.

conformance:
  - id: x12
    name: ASC X12 EDI
    version: '004010'
    conforms: true
    role: implementer
    evidence: https://www.burlington.com/vendors/edi
    note: >-
      Every published implementation guide declares "X12/V4010/<set>" and "Version: 4.0
      Final" on page one, authored by Burlington Stores, Inc. Verified by extracting text
      from the 001, 810, 846, 850, 856, 204 and 997 guides.

  - id: gs1-128
    name: GS1-128 Serial Shipping Container Label (SSCC-18)
    version: '3.0'
    conforms: true
    role: implementer
    evidence: https://cdn.sanity.io/files/k5c6l842/production/cfa0f13b59c0668c1101af15dcb2e54da95cc9b4.pdf
    note: >-
      "GS1-128 SERIAL SHIPPING CONTAINER LABEL Companion Report, Version: 3.0 Final",
      linked from the EDI page as "Bar Code Label Specification". The vendor portals page
      states Gateway will "create GS1-128 labels in a PDF format".

  - id: openapi
    conforms: false
    evidence: https://www.burlington.com/openapi.json
    note: >-
      HTTP 200, but the body is the site's Next.js shell titled "404 Not Found |
      Burlington" — the same body a nonexistent control path returns. No OpenAPI is
      published on any Burlington host.

  - id: oauth2
    conforms: false
    evidence: https://vendors.burlington.com/.well-known/oauth-authorization-server
    note: 404. No OAuth authorization-server metadata on any host.

  - id: rfc9457
    conforms: false
    evidence: https://www.burlington.com/vendors/edi
    note: >-
      Not applicable. Error semantics on this surface are the X12 824 Application Advice
      and 997 Functional Acknowledgment, not HTTP problem+json.

